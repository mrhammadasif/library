# Coolify "Docker Compose" resource. Base directory: /server  Compose file: /docker-compose.coolify.yml
# (Coolify uses the base directory as the compose project directory, so `context: ..` is the repo root.)
# Domain: https://api.library.home.nitroxis.com → api:3000 (set in Coolify). All values come from Coolify's env UI.
# Postgres is the shared Coolify database "nitroxis-pg" (project "common"; database + role `library`, pg_trgm pre-created),
# reached over the `coolify` network ("Connect To Predefined Network"); DATABASE_URL points at its container name.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-homelibrary://}
      EMAIL_FROM: ${EMAIL_FROM:-Home Library <noreply@nitroxis.com>}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      COVERS_PUBLIC_URL: ${COVERS_PUBLIC_URL}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # n8n's SearXNG on n8n_default (internal only); used to web-search books during AI enrichment.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/unsloth/Qwen3.5-0.8B-GGUF:UD-Q4_K_XL}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AI_KEYS_KEY: ${AI_KEYS_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_DAILY_LIMIT: ${GOOGLE_BOOKS_DAILY_LIMIT:-900}
    networks: [default, n8n_default]

networks:
  # Shared with Ollama and SearXNG, so the API reaches http://ollama:11434 and http://searxng:8080.
  n8n_default:
    external: true
