# Coolify "Docker Compose" resource. Base directory: /server  Compose file: /docker-compose.coolify.yml
# (Coolify uses the base directory as the compose project directory, so `context: ..` is the repo root.)
# Domain: https://api.library.home.nitroxis.com → api:3000 (set in Coolify). All values come from Coolify's env UI.
# SearXNG is reached through its public home-server URL with an API key. AI keys come from each library (the app).
# Postgres is the shared Coolify database "nitroxis-pg" (project "common"; database + role `library`, pg_trgm pre-created),
# reached over the `coolify` network ("Connect To Predefined Network"); DATABASE_URL points at its container name.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-homelibrary://}
      EMAIL_FROM: ${EMAIL_FROM:-Home Library <noreply@nitroxis.com>}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      COVERS_PUBLIC_URL: ${COVERS_PUBLIC_URL}
      # The home SearXNG (locked; its own Coolify network), reached via its public URL + API key.
      SEARXNG_URL: ${SEARXNG_URL:-https://searxng.home.nitroxis.com}
      SEARXNG_API_KEY: ${SEARXNG_API_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AI_KEYS_KEY: ${AI_KEYS_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_DAILY_LIMIT: ${GOOGLE_BOOKS_DAILY_LIMIT:-900}
      # Free tier: a few AI suggestions per library per day through OmniRoute (key = Coolify secret; no key = off).
      FREE_AI_BASE_URL: ${FREE_AI_BASE_URL:-https://omniroute.home.nitroxis.com/v1}
      FREE_AI_API_KEY: ${FREE_AI_API_KEY:-}
      FREE_AI_MODEL: ${FREE_AI_MODEL:-hammad/free}
      FREE_AI_PER_LIBRARY: ${FREE_AI_PER_LIBRARY:-5}
      FREE_AI_DAILY_TOTAL: ${FREE_AI_DAILY_TOTAL:-200}
      # Per-library daily allowances (trusted libraries exempt); when spent, lookups/enrichment degrade gracefully.
      LIBRARY_DAILY_GOOGLE_BOOKS: ${LIBRARY_DAILY_GOOGLE_BOOKS:-150}
      LIBRARY_DAILY_WEB_SEARCHES: ${LIBRARY_DAILY_WEB_SEARCHES:-50}
      LIBRARY_DAILY_LOOKUPS: ${LIBRARY_DAILY_LOOKUPS:-300}
