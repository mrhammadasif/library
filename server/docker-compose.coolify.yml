# Coolify "Docker Compose" resource. Base directory: /  Compose file: server/docker-compose.coolify.yml
# Domain: https://api.library.nitroxis.com → api:3000 (set in Coolify). Secrets come from Coolify's env UI.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://library:${POSTGRES_PASSWORD}@db:5432/library
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://api.library.nitroxis.com
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      COVERS_PUBLIC_URL: https://covers.library.nitroxis.com
      OLLAMA_URL: http://ollama:11434
      AI_KEYS_KEY: ${AI_KEYS_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, n8n_default]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - library-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  library-pgdata:

networks:
  # Shared with Ollama, so the API reaches it at http://ollama:11434.
  n8n_default:
    external: true
