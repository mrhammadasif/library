# Signs in with the dedicated, pre-verified test account (password from .maestro/.env.local via scripts/run-e2e.sh).
appId: com.nitroxis.library
---
- extendedWaitUntil:
    visible: "Home Library"
    timeout: 30000
- tapOn:
    id: "sign-in-email"
- inputText: ${TEST_EMAIL}
# The keyboard's "Next" moves to the password box (which may sit behind the keyboard until it's focused).
- pressKey: Enter
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# Android's password manager offers to save the password a moment after sign-in (button "Not now" or "Never");
# wait briefly for it so it can't pop up over a later step.
- extendedWaitUntil:
    visible: "Save password.*"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not now|Never"
    optional: true
