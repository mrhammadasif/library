# Signs in with the dedicated, pre-verified test account (password from .maestro/.env.local via scripts/run-e2e.sh).
appId: com.nitroxis.library
---
- extendedWaitUntil:
    visible: "Home Library"
    timeout: 30000
- tapOn:
    id: "sign-in-email"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# Android's password manager offers to save the password after sign-in; dismiss it when it appears.
- tapOn:
    text: "Not now"
    optional: true
