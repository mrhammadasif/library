# "Add a book here" on a shelf opens the add flow with that shelf already chosen.
# TEST DATA ONLY: creates "Maestro Shelf Library" and deletes it at the end.
appId: com.nitroxis.library
tags:
  - e2e
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
- runFlow: flows/sign-in.yaml
- extendedWaitUntil:
    visible: "Welcome|Hi .*"
    timeout: 20000
- runFlow:
    when:
      notVisible: "Welcome"
    file: flows/delete-library.yaml
- tapOn:
    id: "welcome-library-name"
- inputText: "Maestro Shelf Library"
- hideKeyboard
- tapOn: "Create library"
- extendedWaitUntil:
    visible: ".*set up your library.*"
    timeout: 20000
- tapOn: "Add a bookcase"
- tapOn: "Add a bookcase"
- tapOn:
    id: "bookcase-name"
- inputText: "Maestro Case"
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: ".*Bookcase added.*"
    timeout: 15000
- tapOn: "Top shelf"
- extendedWaitUntil:
    visible: "0 books"
    timeout: 10000

# ── Open the shelf and add straight onto it ──────────────────────────────────
- tapOn: "Top shelf"
- extendedWaitUntil:
    visible: "Add a book here"
    timeout: 10000
- takeScreenshot: shelf-01-empty
- tapOn: "Add a book here"
- extendedWaitUntil:
    visible: ".*New books go on.*Top shelf.*"
    timeout: 10000
- takeScreenshot: shelf-02-scan
- tapOn: "Type it in"
- tapOn:
    id: "book-title"
- inputText: "Maestro Shelf Book"
- hideKeyboard
# No shelf picking: it's already chosen.
- scrollUntilVisible:
    element: "Put it on the shelf"
    direction: DOWN
- takeScreenshot: shelf-03-form
- tapOn: "Put it on the shelf"
- extendedWaitUntil:
    visible: ".*Added to Maestro Case.*Top shelf.*"
    timeout: 15000

# ── Clean up ─────────────────────────────────────────────────────────────────
- launchApp
- extendedWaitUntil:
    visible: "Hi .*"
    timeout: 20000
- runFlow: flows/delete-library.yaml
